services:
  outlook:
    build: .
    image: jev-browser-mcp:local
    init: true
    stdin_open: true
    # MCP over stdio; the human login view listens inside the container on 8765.
    command: [serve, --site, outlook, --host, "0.0.0.0", --port, "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_DEFAULT_MODEL: ${TYPESAFE_DEFAULT_MODEL:-jev-latest}
    volumes:
      - outlook-data:/data
    shm_size: 256mb
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  outlook-data:
