services:
  outlook:
    build: .
    image: jev-browser-mcp:local
    init: true
    stdin_open: true
    command: [serve, --site, outlook]
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_DEFAULT_MODEL: ${TYPESAFE_DEFAULT_MODEL:-jev-latest}
    volumes:
      - outlook-data:/data
    shm_size: 256mb
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  morning:
    build: .
    image: jev-browser-mcp:local
    init: true
    stdin_open: true
    command: [serve, --site, morning]
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_DEFAULT_MODEL: ${TYPESAFE_DEFAULT_MODEL:-jev-latest}
    volumes:
      - morning-data:/data
    shm_size: 256mb
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  outlook-data:
  morning-data:
